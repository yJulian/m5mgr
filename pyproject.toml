[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "m5mgr"
version = "0.1.0"
description = "Run management for gem5: execute, ingest, and compare simulation runs via SQLite."
requires-python = ">=3.10"
dependencies = [
    "flask>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
m5mgr = "m5mgr.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/m5mgr"]
